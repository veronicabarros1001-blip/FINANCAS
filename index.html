<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle Financeiro</title>
    
    <!-- Bibliotecas Necessárias -->
    <script src="https://tailwindcss.com"></script>
    <script src="https://jsdelivr.net"></script>
    <link href="https://cloudflare.com" rel="stylesheet">
    
    <!-- Configuração do Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                        secondary: '#10b981',
                        danger: '#ef4444',
                        warning: '#f59e0b',
                        dark: '#1f2937',
                        light: '#f3f4f6'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://googleapis.com');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f3f4f6; 
            color: #1f2937; 
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        .card-shadow { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .transition-all { transition-property: all; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 300ms; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    
    <div class="max-w-7xl mx-auto space-y-6">
        
        <header class="bg-white rounded-xl p-6 card-shadow flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-dark flex items-center gap-2">
                    <i class="fas fa-wallet text-primary"></i> Meu Dashboard Financeiro
                </h1>
                <p class="text-sm text-gray-500 mt-1">Controle inteligente de gastos, planejamento e projeções</p>
            </div>
            
            <div class="flex items-center gap-3 bg-light p-3 rounded-lg border border-gray-200">
                <label for="rendaMensal" class="font-medium text-gray-700 whitespace-nowrap">Renda Líquida:</label>
                <div class="relative flex-1">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 font-semibold">R$</span>
                    <input type="number" id="rendaMensal" value="5000" min="0" step="100" class="w-full pl-9 pr-3 py-2 border rounded-md focus:ring-2 focus:ring-primary focus:border-primary outline-none text-lg font-bold text-gray-800 transition-all text-right" placeholder="0.00" onchange="atualizarDashboard()">
                </div>
            </div>
        </header>

        <!-- Resumo de Cards Principais -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-xl card-shadow border-l-4 border-secondary">
                <div class="text-sm font-medium text-gray-500 uppercase">Total de Gastos</div>
                <div class="text-2xl font-bold text-dark mt-2" id="totalGastos">R$ 0,00</div>
            </div>
            <div class="bg-white p-6 rounded-xl card-shadow border-l-4 border-primary">
                <div class="text-sm font-medium text-gray-500 uppercase">Saldo Restante</div>
                <div class="text-2xl font-bold text-dark mt-2" id="saldoRestante">R$ 5.000,00</div>
            </div>
            <div class="bg-white p-6 rounded-xl card-shadow border-l-4 border-warning">
                <div class="text-sm font-medium text-gray-500 uppercase">Regra 50/30/20 (Essenciais)</div>
                <div class="text-2xl font-bold text-dark mt-2" id="statusRegra">0% / 50%</div>
            </div>
        </div>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Left Column: Input and List -->
            <div class="lg:col-span-2 space-y-6">
                
                <div class="bg-white rounded-xl p-6 card-shadow border-t-4 border-primary" id="cardFormulario">
                    <h2 class="text-lg font-semibold mb-4 border-b pb-2 flex items-center gap-2" id="tituloFormulario">
                        <i class="fas fa-plus-circle text-secondary"></i> Novo Lançamento
                    </h2>
                    <form id="formGasto" class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end" onsubmit="adicionarGasto(event)">
                        <div class="md:col-span-3">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Descrição</label>
                            <input type="text" id="descGasto" required class="w-full p-2 border rounded-md focus:ring-2 focus:ring-primary outline-none" placeholder="Ex: Aluguel...">
                        </div>
                        <div class="md:col-span-2 relative">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Categoria</label>
                            <div class="relative">
                                <select id="catGasto" required class="w-full p-2 border rounded-md focus:ring-2 focus:ring-primary outline-none">
                                    <option value="Moradia">Moradia</option>
                                    <option value="Alimentação">Alimentação</option>
                                    <option value="Transporte">Transporte</option>
                                    <option value="Lazer">Lazer</option>
                                    <option value="Outros">Outros</option>
                                </select>
                            </div>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Total (R$)</label>
                            <div class="relative">
                                <span class="absolute left-2 top-1/2 -translate-y-1/2 text-gray-500 text-sm">R$</span>
                                <input type="number" id="valorGasto" required min="0.01" step="0.01" class="w-full pl-7 p-2 border rounded-md focus:ring-2 focus:ring-primary outline-none text-right" placeholder="0.00">
                            </div>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">1ª Parcela</label>
                            <input type="date" id="dataGasto" required class="w-full p-2 border rounded-md focus:ring-2 focus:ring-primary outline-none text-sm">
                        </div>
                        <div class="md:col-span-1">
                            <label class="block text-sm font-medium text-gray-700 mb-1" title="Quantidade de parcelas">Parc.</label>
                            <input type="number" id="parcelasGasto" value="1" min="1" max="120" required class="w-full p-2 border rounded-md focus:ring-2 focus:ring-primary outline-none text-center">
                        </div>
                        
                        <input type="hidden" id="tipo503020" value="essencial">
                        
                        <div class="md:col-span-2">
                            <button type="submit" id="btnSalvar" class="w-full bg-primary hover:bg-indigo-700 text-white font-medium py-2 px-2 rounded-md transition-colors flex justify-center items-center gap-2 text-sm">
                                <i class="fas fa-check"></i> Salvar
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Tabela de Lançamentos -->
                <div class="bg-white rounded-xl p-6 card-shadow">
                    <h2 class="text-lg font-semibold mb-4 border-b pb-2 flex items-center gap-2">
                        <i class="fas fa-list text-primary"></i> Histórico de Despesas
                    </h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-light text-gray-700 text-sm uppercase">
                                    <th class="p-3">Descrição</th>
                                    <th class="p-3">Categoria</th>
                                    <th class="p-3 text-right">Valor</th>
                                    <th class="p-3 text-center">Data</th>
                                    <th class="p-3 text-center">Parc.</th>
                                    <th class="p-3 text-center">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="listaGastos" class="divide-y text-gray-600">
                                <!-- Elementos injetados via JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>

            <!-- Right Column: Charts and Analysis -->
            <div class="space-y-6">
                <div class="bg-white rounded-xl p-6 card-shadow">
                    <h2 class="text-lg font-semibold mb-4 border-b pb-2 flex items-center gap-2">
                        <i class="fas fa-chart-pie text-warning"></i> Distribuição por Categorias
                    </h2>
                <canvas id="graficoCategorias" class="max-h-64 mx-auto"></canvas>
            </div>
        </div>

    </div>

    <script>
        let gastos = JSON.parse(localStorage.getItem('gastos_dashboard')) || [];
        let meuGrafico = null;

        function formatarMoeda(valor) {
            return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function adicionarGasto(event) {
            event.preventDefault();
            
            const desc = document.getElementById('descGasto').value;
            const categoria = document.getElementById('catGasto').value;
            const valor = parseFloat(document.getElementById('valorGasto').value);
            const data = document.getElementById('dataGasto').value;
            const parcelas = parseInt(document.getElementById('parcelasGasto').value);

            const novoGasto = {
                id: Date.now(),
                desc,
                categoria,
                valor,
                data,
                parcelas
            };

            gastos.push(novoGasto);
            localStorage.setItem('gastos_dashboard', JSON.stringify(gastos));
            
            document.getElementById('formGasto').reset();
            document.getElementById('parcelasGasto').value = 1;
            
            atualizarDashboard();
        }

        function deletarGasto(id) {
            gastos = gastos.filter(g => g.id !== id);
            localStorage.setItem('gastos_dashboard', JSON.stringify(gastos));
            atualizarDashboard();
        }

        function atualizarDashboard() {
            const renda = parseFloat(document.getElementById('rendaMensal').value) || 0;
            const lista = document.getElementById('listaGastos');
            lista.innerHTML = '';

            let total = 0;
            let categoriasValores = { 'Moradia': 0, 'Alimentação': 0, 'Transporte': 0, 'Lazer': 0, 'Outros': 0 };

            gastos.forEach(g => {
                total += g.valor;
                if (categoriasValores[g.categoria] !== undefined) {
                    categoriasValores[g.categoria] += g.valor;
                } else {
                    categoriasValores['Outros'] += g.valor;
                }

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50';
                tr.innerHTML = `
                    <td class="p-3 font-medium text-dark">${g.desc}</td>
                    <td class="p-3"><span class="px-2 py-1 bg-indigo-50 text-indigo-700 rounded-full text-xs">${g.categoria}</span></td>
                    <td class="p-3 text-right font-bold">${formatarMoeda(g.valor)}</td>
                    <td class="p-3 text-center text-sm">${g.data.split('-').reverse().join('/')}</td>
                    <td class="p-3 text-center text-sm">${g.parcelas}x</td>
                    <td class="p-3 text-center">
                        <button onclick="deletarGasto(${g.id})" class="text-danger hover:text-red-700 p-1"><i class="fas fa-trash-alt"></i></button>
                    </td>
                `;
                lista.appendChild(tr);
            });

            if (gastos.length === 0) {
                lista.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-400">Nenhum lançamento registrado.</td></tr>`;
            }

            const saldo = renda - total;
            document.getElementById('totalGastos').innerText = formatarMoeda(total);
            document.getElementById('saldoRestante').innerText = formatarMoeda(saldo);
            
            const percEssencial = renda > 0 ? ((total / renda) * 100).toFixed(1) : 0;
            document.getElementById('statusRegra').innerText = `${percEssencial}% / 50%`;

            atualizarGrafico(categoriasValores);
        }

        function atualizarGrafico(dados) {
            const ctx = document.getElementById('graficoCategorias').getContext('2d');
            
            if (meuGrafico) {
                meuGrafico.destroy();
            }

            meuGrafico = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(dados),
                    datasets: [{
                        data: Object.values(dados),
                        backgroundColor: ['#4f46e5', '#10b981', '#f59e0b', '#ef4444', '#9ca3af']
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }

        window.onload = function() {
            atualizarDashboard();
        }
    </script>
</body>
</html>
